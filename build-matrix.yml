# Build environments and APT targets.

platforms:
  debian13:
    base_image: debian:trixie
    suite: trixie
    architectures:
      - amd64
      - arm64

  ubuntu2404:
    base_image: ubuntu:24.04
    suite: noble
    architectures:
      - amd64
      - arm64

  ubuntu2604:
    base_image: ubuntu:26.04
    suite: resolute
    architectures:
      - amd64
      - arm64

products:
  omabuntu:
    label: Omabuntu
    suites:
      noble:
        platform: ubuntu2404
        status: active
      resolute:
        platform: ubuntu2604
        status: active

  omadeb:
    label: Omadeb
    suites:
      trixie:
        platform: debian13
        status: active

  omari:
    label: Omari
    suites:
      trixie:
        platform: debian13
        status: active
